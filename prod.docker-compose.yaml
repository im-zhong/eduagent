# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-prod-${USER}

services:
  eduagent-api:
    build:
      context: .
      dockerfile: prod.Dockerfile
      args:
        UID: ${UID}
        USER: ${USER}
    # The image field allows you to specify the name and tag of the image that will be built.
    image: eduagent-prod
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    ports:
      - "${EDUAGENT_API_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-db

  eduagent-ui:
    image: eduagent-prod
    command: ["ui"]
    hostname: ui.eduagent
    ports:
      - "${EDUAGENT_UI_PORT:-8501}:8501"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-api
      - eduagent-db

  eduagent-db:
    image: postgres:17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    networks:
      - eduagent-prod-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    hostname: prometheus.eduagent
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    networks:
      - eduagent-prod-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    hostname: grafana.eduagent
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana:/var/lib/grafana
    networks:
      - eduagent-prod-network
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    hostname: cadvisor.eduagent
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - eduagent-prod-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    hostname: node-exporter.eduagent
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - eduagent-prod-network
    # Windows 用户注意: node-exporter 在 Windows 下可能无法正常工作
    # 如果启动失败，可以禁用此服务：
    # docker compose -f prod.docker-compose.yaml up -d --scale node-exporter=0
    profiles:
      - monitoring-full  # 使用 profile 使其可选

networks:
  eduagent-prod-network:
