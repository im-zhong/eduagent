# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-prod-${USER}

services:
  eduagent-api:
    # build:
    #   context: .
    #   dockerfile: prod.Dockerfile
    #   args:
    #     UID: ${USER_UID}
    #     USER: ${USER}
    # # The image field allows you to specify the name and tag of the image that will be built.
    image: eduagent-prod
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    ports:
      - "${EDUAGENT_API_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-db

  eduagent-ui:
    image: eduagent-prod
    command: ["ui"]
    hostname: ui.eduagent
    ports:
      - "${EDUAGENT_UI_PORT:-8501}:8501"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-api
      - eduagent-db

  eduagent-db:
    image: postgres:17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    networks:
      - eduagent-prod-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # 容器监控 - 收集 Docker 容器指标
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    hostname: cadvisor.eduagent
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    networks:
      - eduagent-prod-network

  # Prometheus - 时序数据库和监控系统
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    hostname: prometheus.eduagent
    user: root
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./eduagent/monitor/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    networks:
      - eduagent-prod-network
    depends_on:
      - cadvisor

  # Grafana - 可视化监控仪表板
  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    hostname: grafana.eduagent
    user: root
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./eduagent/monitor/grafana/provisioning:/etc/grafana/provisioning
      - ./eduagent/monitor/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./data/grafana:/var/lib/grafana
    networks:
      - eduagent-prod-network
    depends_on:
      - prometheus

networks:
  eduagent-prod-network:
