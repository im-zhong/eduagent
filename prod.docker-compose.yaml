# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-prod-${USER}

services:
  eduagent-api:
    # build:
    #   context: .
    #   dockerfile: prod.Dockerfile
    #   args:
    #     UID: ${USER_UID}
    #     USER: ${USER}
    # # The image field allows you to specify the name and tag of the image that will be built.
    image: eduagent-prod
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    ports:
      - "${EDUAGENT_API_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-db
      - eduagent-rabbitmq
      - eduagent-milvus

  eduagent-ui:
    image: eduagent-prod
    command: ["ui"]
    hostname: ui.eduagent
    ports:
      - "${EDUAGENT_UI_PORT:-8501}:8501"
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-prod-network:
    depends_on:
      - eduagent-api
      - eduagent-db
      - eduagent-milvus

  eduagent-db:
    image: postgres:17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    networks:
      - eduagent-prod-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  eduagent-rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq.eduagent
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-eduagent}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-eduagent}
    expose:
      - 5672
    ports:
      - "${RABBITMQ_UI_PORT:-25672}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - eduagent-prod-network

  eduagent-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    hostname: etcd.eduagent
    restart: unless-stopped
    command: >
      etcd
      --advertise-client-urls=http://etcd.eduagent:2379
      --listen-client-urls=http://0.0.0.0:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd.eduagent:2380
      --initial-cluster=etcd.eduagent=http://etcd.eduagent:2380
      --data-dir=/etcd-data
      --snapshot-count=10000
      --auto-compaction-retention=1
    expose:
      - 2379
    volumes:
      - ./data/etcd:/etcd-data
    networks:
      - eduagent-prod-network

  eduagent-minio:
    image: minio/minio:RELEASE.2024-11-07T00-48-20Z
    hostname: minio.eduagent
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - 9000
      - 9001
    ports:
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - eduagent-prod-network

  eduagent-milvus:
    image: milvusdb/milvus:v2.4.13
    hostname: milvus.eduagent
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=eduagent-etcd:2379
      - MINIO_ADDRESS=eduagent-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    expose:
      - 19530
      - 9091
    volumes:
      - ./data/milvus:/var/lib/milvus
    networks:
      - eduagent-prod-network
    depends_on:
      - eduagent-etcd
      - eduagent-minio

  eduagent-celery-worker:
    image: eduagent-prod
    command:
      - celery
      - -A
      - eduagent.tasks.app.celery_app
      - worker
      - -l
      - info
    hostname: celery.eduagent
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      - eduagent-prod-network
    depends_on:
      - eduagent-rabbitmq
      - eduagent-db
      - eduagent-milvus

  # 容器监控 - 收集 Docker 容器指标
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    hostname: cadvisor.eduagent
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    networks:
      - eduagent-prod-network

  # Prometheus - 时序数据库和监控系统
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    hostname: prometheus.eduagent
    user: root
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./eduagent/monitor/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    networks:
      - eduagent-prod-network
    depends_on:
      - cadvisor

  # Grafana - 可视化监控仪表板
  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    hostname: grafana.eduagent
    user: root
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./eduagent/monitor/grafana/provisioning:/etc/grafana/provisioning
      - ./eduagent/monitor/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./data/grafana:/var/lib/grafana
    networks:
      - eduagent-prod-network
    depends_on:
      - prometheus

networks:
  eduagent-prod-network:
