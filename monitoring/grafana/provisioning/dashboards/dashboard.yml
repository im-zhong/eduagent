# Grafana 仪表板配置
# 自动加载仪表板

apiVersion: 1

providers:
  - name: 'Docker Monitoring'
    orgId: 1
    folder: 'Docker'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true


