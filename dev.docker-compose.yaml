# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-${USER}

services:
  eduagent-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${USER_UID}
        USER: ${USER}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - ANTHROPIC_SMALL_FAST_MODEL=${ANTHROPIC_SMALL_FAST_MODEL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    # The image field allows you to specify the name and tag of the image that will be built.
    image: eduagent:${USER}
    command: ["dev"]
    hostname: dev.eduagent
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
      # use local host's git config, ssh keys, credentials to access github repos
      - ~/.gitconfig:/home/${USER}/.gitconfig:ro
      - ~/.git-credentials:/home/${USER}/.git-credentials:ro
      - ~/.ssh:/home/${USER}/.ssh:ro
      # use local cache, so that we do not install pre commit every time after we rebuild continaer
      - ~/.cache:/home/${USER}/.cache
      # mapping the claude conf file, so we do not need to login again and again
      - ./.claude:/home/${USER}/.claude
      - ./.claude.json:/home/${USER}/.claude.json
    networks:
      eduagent-network:
    depends_on:
      - eduagent-db

  eduagent-api:
    image: eduagent:${USER}
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-network:
    depends_on:
      - eduagent-dev

  eduagent-ui:
    image: eduagent:${USER}
    command: ["ui"]
    hostname: ui.eduagent
    expose:
      - 8501
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      eduagent-network:
    depends_on:
      - eduagent-dev
      - eduagent-db

  eduagent-db:
    image: postgres:17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    networks:
      - eduagent-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    restart: unless-stopped
    hostname: prometheus.eduagent
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    networks:
      - eduagent-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    restart: unless-stopped
    hostname: grafana.eduagent
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana:/var/lib/grafana
    networks:
      - eduagent-network
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-dev
    restart: unless-stopped
    hostname: cadvisor.eduagent
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - eduagent-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-dev
    restart: unless-stopped
    hostname: node-exporter.eduagent
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - eduagent-network
    # Windows 用户注意: node-exporter 在 Windows 下可能无法正常工作
    # 如果启动失败，可以禁用此服务：
    # docker compose -f dev.docker-compose.yaml up -d --scale node-exporter=0
    profiles:
      - monitoring-full  # 使用 profile 使其可选

networks:
  eduagent-network:
