# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-${USER}

services:
  eduagent-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${USER_UID}
        USER: ${USER}
    environment:
      - ANTHROPIC_API_KEY=${USER_ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${USER_ANTHROPIC_MODEL}
      - ANTHROPIC_SMALL_FAST_MODEL=${USER_ANTHROPIC_SMALL_FAST_MODEL}
      - ANTHROPIC_BASE_URL=${USER_ANTHROPIC_BASE_URL}

    # The image field allows you to specify the name and tag of the image that will be built.
    image: eduagent:${USER}
    command: ["dev"]
    hostname: dev.eduagent
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
      # use local host's git config, ssh keys, credentials to access github repos
      - ~/.gitconfig:/home/${USER}/.gitconfig:ro
      - ~/.git-credentials:/home/${USER}/.git-credentials:ro
      - ~/.ssh:/home/${USER}/.ssh:ro
      - /etc/ssh:/etc/ssh:ro
      # use local cache, so that we do not install pre commit every time after we rebuild continaer
      - ~/.cache:/home/${USER}/.cache
      # mapping the claude conf file, so we do not need to login again and again
      - ./.claude:/home/${USER}/.claude
      - ./.claude.json:/home/${USER}/.claude.json
    networks:
      - eduagent-network
    depends_on:
      - eduagent-api

  eduagent-ui:
    image: eduagent:${USER}
    command: ["ui"]
    hostname: ui.eduagent
    expose:
      - 8501
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      - eduagent-network
    depends_on:
      - eduagent-api

  eduagent-api:
    image: eduagent:${USER}
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      - eduagent-network
    depends_on:
      - eduagent-db
      - eduagent-redis

  eduagent-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    volumes:
      # - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # init docker of database
    networks:
      - eduagent-network

  eduagent-redis:
    image: redis:7
    hostname: redis.eduagent
    restart: unless-stopped
    expose:
      - 6379
    networks:
      - eduagent-network

