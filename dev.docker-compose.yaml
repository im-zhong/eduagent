# docker compose file for development environment
# refs:
#   - https://docs.docker.com/reference/compose-file/services/
#   - https://docs.docker.com/reference/compose-file/services/#build
#   - https://docs.docker.com/reference/compose-file/build/

name: eduagent-${USER}

services:
  eduagent-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${USER_UID}
        USER: ${USER}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - ANTHROPIC_SMALL_FAST_MODEL=${ANTHROPIC_SMALL_FAST_MODEL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    image: eduagent:${USER}
    command: ["dev"]
    hostname: dev.eduagent
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
      - ~/.gitconfig:/home/${USER}/.gitconfig:ro
      - ~/.git-credentials:/home/${USER}/.git-credentials:ro
      - ~/.ssh:/home/${USER}/.ssh:ro
      - ~/.cache:/home/${USER}/.cache
      - ./.claude:/home/${USER}/.claude
      - ./.claude.json:/home/${USER}/.claude.json
    networks:
      - eduagent-network
    depends_on:
      - eduagent-db

  eduagent-api:
    image: eduagent:${USER}
    command: ["api"]
    hostname: api.eduagent
    expose:
      - 8000
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      - eduagent-network
    depends_on:
      - eduagent-db
      - eduagent-redis

  eduagent-ui:
    image: eduagent:${USER}
    command: ["ui"]
    hostname: ui.eduagent
    expose:
      - 8501
    restart: unless-stopped
    volumes:
      - .:/home/${USER}/eduagent
    networks:
      - eduagent-network
    depends_on:
      - eduagent-dev
      - eduagent-db

  eduagent-db:
    image: postgres:17
    restart: unless-stopped
    hostname: db.eduagent
    expose:
      - 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ysu_keg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456789}
      - POSTGRES_DB=${POSTGRES_DB:-eduagent}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - eduagent-network

  eduagent-redis:
    image: redis:7
    hostname: redis.eduagent
    restart: unless-stopped
    expose:
      - 6379
    networks:
      - eduagent-network

networks:
  eduagent-network:
    name: eduagent-${USER}-network
