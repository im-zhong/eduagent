name: Container Deployment and Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg USER=$USER \
            -f prod.Dockerfile \
            -t eduagent-prod .

      - name: Deploy Services
        run: docker compose -f prod.docker-compose.yaml up -d

      # 替换sleep
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to start..."
          # 循环最多等待60秒
          for i in {1..12}; do
            # 进入名为 'eduagent-db' 的容器，并执行 pg_isready 命令
            # 注意: `-U ${POSTGRES_USER:-ysu_keg}` 会使用你在 prod.docker-compose.yaml 中定义的用户，更具弹性
            if docker compose -f prod.docker-compose.yaml exec -T eduagent-db pg_isready -U ${POSTGRES_USER:-ysu_keg}; then
              echo "PostgreSQL is ready!"
              exit 0 # 成功退出
            fi
            echo "Waiting for PostgreSQL... ($i/12)"
            sleep 5
          done
          echo "PostgreSQL did not become ready in time."
          exit 1 # 失败退出

      - name: Run all tests
        run: docker compose -f prod.docker-compose.yaml exec -T eduagent-api env PYTHONPATH=. uv run pytest

      - name: Tear down services
        if: always() # 确保无论成功或失败，清理步骤都会运行
        run: docker compose -f prod.docker-compose.yaml down
