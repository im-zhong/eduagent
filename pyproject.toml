[project]
name = "eduagent"
version = "0.1.0"
description = "Education Agent: An Intelligent Question Generation System"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.116.1",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8.0",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "loguru>=0.7.3",
    "pandas>=2.2.0",
    "pandas-stubs>=2.3.2.250827",
    "plotly>=5.22.0",
    "plotly-stubs>=0.0.6",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11.9",
    "requests>=2.32.5",
    "streamlit>=1.49.1",
    "uvicorn>=0.35.0",
    "langchain-postgres",
    "langchain-community>=0.2.19",
    "zhipuai>=2.0.0",
    "langgraph",
    # "casbin>=1.43.0",
    "celery>=5.6.0",
    "pymilvus>=2.6.5",
    "minio>=7.2.20",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "redis>=7.1.0",
    "langchain-openai>=0.3.35",
]

[dependency-groups]
dev = [
    "faker>=37.8.0",
    "pre-commit>=4.3.0",
    "pyright[nodejs]>=1.1.405",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
# norecursedirs = ["data", ".git", ".venv", "dist", "build", "node_modules"]
testpaths = ["tests"] # only detect tests on the tests dir
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires external services)",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "ERA",
    "PGH",
    "RUF003",
    "E501",
    "COM",
    "FA102",
    "T20",
    "TD",
    "FIX",
    "BLE",
    "S",
    "G",
    "TC",
    "RUF001",
    "B008",
]


[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["eduagent", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "data",
]

#[tool.pyright.report]
# reportUnknownMemberType = "none"
# let pyright do not complain about missing type stubs for third-party libraries
# /home/zhangzhong/eduagent/tests/unit/test_api_key.py
#   /home/zhangzhong/eduagent/tests/unit/test_api_key.py:1:8 - error: Stub file not found for "zhipuai" (reportMissingTypeStubs)
#   /home/zhangzhong/eduagent/tests/unit/test_api_key.py:2:6 - error: Stub file not found for "zhipuai.types.chat.chat_completion" (reportMissingTypeStubs)
# 2 errors, 0 warnings, 0 informations
reportMissingTypeStubs = false

[tool.setuptools]
packages = ["eduagent"]

[tool.ruff.lint.per-file-ignores]
"eduagent/api/api.py" = ["ARG001"]
"eduagent/user/manager.py" = ["ARG002"]
