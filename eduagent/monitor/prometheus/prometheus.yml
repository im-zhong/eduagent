global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eduagent-monitor'

# 告警规则配置（可选）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# 告警规则文件（可选）
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'production'

  # Docker 容器监控 (通过 cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          environment: 'production'

  # PostgreSQL 数据库监控（可选，需要添加 postgres-exporter）
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

  # EduAgent API 监控（如果应用暴露了 /metrics 端点）
