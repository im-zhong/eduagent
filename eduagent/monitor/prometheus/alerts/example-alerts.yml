# Prometheus 告警规则示例
# 
# 使用方法:
# 1. 取消 prometheus.yml 中 rule_files 的注释
# 2. 重启 Prometheus 容器
# 3. 在 Grafana 中配置通知渠道

groups:
  # 容器资源告警
  - name: container_alerts
    interval: 30s
    rules:
      # 容器内存使用超过 80%
      - alert: ContainerHighMemoryUsage
        expr: |
          (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) > 0.8
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "容器 {{ $labels.name }} 内存使用率过高"
          description: "容器 {{ $labels.name }} 内存使用率为 {{ $value | humanizePercentage }}，已持续 5 分钟"

      # 容器 CPU 使用持续高于 80%
      - alert: ContainerHighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total{name!=""}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "容器 {{ $labels.name }} CPU 使用率过高"
          description: "容器 {{ $labels.name }} CPU 使用率为 {{ $value | humanizePercentage }}，已持续 5 分钟"

      # 容器重启
      - alert: ContainerRestarted
        expr: |
          rate(container_last_seen{name!=""}[5m]) > 0
        for: 1m
        labels:
          severity: info
          component: container
        annotations:
          summary: "容器 {{ $labels.name }} 已重启"
          description: "容器 {{ $labels.name }} 在过去 5 分钟内重启"

  # 磁盘空间告警
  - name: disk_alerts
    interval: 5m
    rules:
      # 磁盘使用超过 80%
      - alert: HighDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) > 0.8
        for: 10m
        labels:
          severity: warning
          component: disk
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘 {{ $labels.mountpoint }} 使用率为 {{ $value | humanizePercentage }}"

      # 磁盘使用超过 90% - 严重告警
      - alert: CriticalDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) > 0.9
        for: 5m
        labels:
          severity: critical
          component: disk
        annotations:
          summary: "磁盘空间严重不足"
          description: "磁盘 {{ $labels.mountpoint }} 使用率为 {{ $value | humanizePercentage }}，请立即清理"

  # Prometheus 自身告警
  - name: prometheus_alerts
    interval: 1m
    rules:
      # Prometheus 无法抓取目标
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          component: prometheus
        annotations:
          summary: "Prometheus 抓取目标失败"
          description: "{{ $labels.job }} 的目标 {{ $labels.instance }} 已宕机超过 2 分钟"

      # Prometheus 配置重载失败
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus 配置重载失败"
          description: "Prometheus 配置重载失败，请检查配置文件"

      # TSDB 压缩失败
      - alert: PrometheusTSDBCompactionsFailed
        expr: rate(prometheus_tsdb_compactions_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: prometheus
        annotations:
          summary: "Prometheus TSDB 压缩失败"
          description: "TSDB 压缩失败率: {{ $value | humanize }}"

# 使用说明:
# 
# 1. 告警级别:
#    - info: 信息性告警
#    - warning: 警告，需要关注
#    - critical: 严重，需要立即处理
#
# 2. 在 Grafana 中配置通知渠道:
#    Alerting → Contact points → New contact point
#    支持: Email, Slack, Webhook, 企业微信等
#
# 3. 测试告警规则:
#    访问 http://localhost:9090/alerts 查看告警状态



